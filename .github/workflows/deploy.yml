# Deploys the site Worker (www.zapakid.ro, zapakid.ro, app.zapakid.ro) to Cloudflare when a PR is merged to main.
# Credentials live only in the `production` environment of this repo (Settings → Environments):
#   secret:   CLOUDFLARE_API_TOKEN (Workers scripts + routes, zapakid.ro zone only)
#   variable: CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy
