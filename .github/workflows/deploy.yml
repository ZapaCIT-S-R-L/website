# Deploys the site Worker (www.zapakid.ro, zapakid.ro) to Cloudflare when a PR is merged to main,
# then runs the end-to-end tests against the live site and rolls back to the previous version if they fail.
# Credentials live only in the `production` environment of this repo (Settings → Environments):
#   secret:   CLOUDFLARE_API_TOKEN (Workers scripts + routes, zapakid.ro zone only)
#   variable: CLOUDFLARE_ACCOUNT_ID
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://www.zapakid.ro
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: npm ci
      - run: npm test
      - run: npx wrangler deploy --dry-run --outdir dist

      - name: Deploy
        run: npx wrangler deploy

      - name: End-to-end tests against the live site
        id: smoke
        env:
          BASE_URL: https://www.zapakid.ro
          LIVE: "1"
        run: |
          sleep 10
          npm run test:e2e || { sleep 30; npm run test:e2e; }

      - name: Roll back to the previous version
        if: failure() && steps.smoke.conclusion == 'failure'
        run: npx wrangler rollback --yes --message "e2e failed after deploy of ${{ github.sha }}"
